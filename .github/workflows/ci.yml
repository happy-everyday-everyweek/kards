name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: '8.11.1'

jobs:
  test:
    name: 单元测试与集成测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: 运行测试
        run: gradle :core:test --no-daemon --stacktrace

      - name: 汇总测试结果
        if: always()
        run: |
          echo "=== 测试结果汇总 ==="
          if [ -d core/build/test-results/test ]; then
            python3 - <<'PY'
import glob, xml.etree.ElementTree as ET
t = f = e = s = 0
for p in glob.glob('core/build/test-results/test/*.xml'):
    r = ET.parse(p).getroot()
    t += int(r.get('tests', 0)); f += int(r.get('failures', 0))
    e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
print(f'合计: tests={t} failures={f} errors={e} skipped={s}')
PY
          else
            echo "未找到测试结果目录"
          fi

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core/build/reports/tests/
          if-no-files-found: ignore

  build-apk:
    name: 构建 Debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: 构建 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: kards-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 输出 APK 信息
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK"
          ls -lh "$APK"